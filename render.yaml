services:
  - type: web
    name: built-with-claude-japan-2026-jingushi
    runtime: node
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_DEMO
        value: "1"
      - key: NODE_VERSION
        value: "22"
      - key: LIMIT_PER_MINUTE
        value: "60"
      - key: LIMIT_PER_DAY
        value: "1000"
      - key: LIMIT_PER_CLIENT_DAY
        value: "400"
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
