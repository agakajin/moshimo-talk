services:
  - type: web
    name: hinan-hanashi
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: "true"
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22"
      - key: APP_PASSWORD
        sync: false
